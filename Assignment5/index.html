<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile Card</title>
<style>
  /* width will include padding and border (easier maths!) */
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, sans-serif; background: #eef2f8; }

  .card {
    width: 280px;
    margin: 24px auto;
    background: white;
    border: 2px solid #2f5bea;
    border-radius: 16px;
    padding: 20px;
    text-align: center;
  }

  /* 50% radius = perfect circle */
  .avatar {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #2f5bea;
    color: white;
    font-size: 36px;
    line-height: 90px;
    margin: 0 auto 10px;
  }

  /* fixed height + overflow auto = scroll bar */
  .bio {
    height: 80px;
    overflow: auto;
    text-align: left;
    border: 1px solid #ccd;
    padding: 8px;
    margin-top: 12px;
    font-size: 14px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">A</div>
    <h2>Arrima Singh</h2>
    <p>Web Developer in Making</p>
    <div class="bio">
      Hi! I am Arrima. I started coding this year. I like making small websites,
      exploring AI tools and listening to music. My goal is to build my own app. This long
      text is here so that the box shows a scroll bar. Try scrolling it!
    </div>
  </div>
</body>
</html>
